services:
  omniroute:
    image: 'ghcr.io/diegosouzapw/omniroute:latest-web'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - HOSTNAME=0.0.0.0
      - PORT=20128
      - 'LIVE_WS_ALLOWED_ORIGINS=https://your-domain.com'
      - 'REDIS_URL=redis://redis:6379'
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - 'BIFROST_BASE_URL=http://bifrost:8080'
      - INITIAL_PASSWORD=CHANGEME
      - JWT_SECRET=
      - API_KEY_SECRET=
      - STORAGE_ENCRYPTION_KEY=
    volumes:
      - 'omniroute-data:/app/data'
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: 'redis:7-alpine'
    restart: unless-stopped
    volumes:
      - 'redis-data:/data'
    command: 'redis-server --save 60 1 --loglevel warning'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    volumes:
      - 'qdrant-data:/qdrant/storage'
    healthcheck:
      test: bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  bifrost:
    image: maximhq/bifrost
    restart: unless-stopped
    volumes:
      - 'bifrost-data:/app/data'
    environment:
      - APP_PORT=8080
      - APP_HOST=0.0.0.0
      - LOG_LEVEL=info
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  omniroute-data:
  redis-data:
  qdrant-data:
  bifrost-data:
