services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    pull_policy: always
    container_name: cli-proxy-api
    environment:
      DEPLOY: coolify
      PGSTORE_DSN: postgresql://cliproxy:cliproxy@postgres:5432/cliproxy
      PGSTORE_SCHEMA: public
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: ./config.yaml
        target: /CLIProxyAPI/config.yaml
        content: |
          host: ""
          port: 8317
          tls:
            enable: false
            cert: ""
            key: ""
          remote-management:
            allow-remote: true
            secret-key: ""
            disable-control-panel: false
            panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"
          auth-dir: "/root/.cli-proxy-api"
          api-keys: []
          debug: false
          logging-to-file: false
          commercial-mode: false
          usage-statistics-enabled: true
          proxy-url: ""
          force-model-prefix: false
          request-retry: 3
          max-retry-interval: 30
          disable-cooling: false
          save-cooldown-status: true
          quota-exceeded:
            switch-project: true
            switch-preview-model: true
          routing:
            strategy: "round-robin"
            session-affinity: false
          ws-auth: true
      - cli-proxy-auths:/root/.cli-proxy-api
      - cli-proxy-logs:/CLIProxyAPI/logs
      - cli-proxy-plugins:/CLIProxyAPI/plugins
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8317"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: cliproxy-postgres
    environment:
      POSTGRES_USER: cliproxy
      POSTGRES_PASSWORD: cliproxy
      POSTGRES_DB: cliproxy
      TZ: ${TZ:-UTC}
    volumes:
      - cli-proxy-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliproxy -d cliproxy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: cliproxy-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cli-proxy-auths:
  cli-proxy-logs:
  cli-proxy-plugins:
  cli-proxy-pgdata:
