<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Image Downloader | My Tech Site</title>

    <link rel="stylesheet" href="../css/style.css?v=6811d9d">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
/* --- Toggle SFW/NSFW --- */
.mode-toggle {
    display: flex;
    gap: 0;
    margin-bottom: 10px;
    border-radius: 50px;
    overflow: hidden;
    border: 1px solid var(--border-color);
}
.mode-toggle button {
    flex: 1;
    padding: 12px 20px;
    border: none;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-dim);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    border-radius: 0;
    min-width: auto;
    display: flex;
    align-items: center;
    justify-content: center;
}
.mode-toggle button.active {
    background: var(--primary-color);
    color: #000;
}

/* --- NSFW Warning --- */
.nsfw-warning {
    background: rgba(255, 0, 110, 0.1);
    border: 1px solid var(--error-color);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 0.85rem;
    color: var(--error-color);
    display: none;
}
.nsfw-warning.visible {
    display: block;
}

/* --- Tags (flex-wrap, contrast fixed) --- */
.tag-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    justify-content: center;
}
.tag-btn {
    padding: 6px 14px;
    border-radius: 50px;
    border: 1px solid rgba(0, 255, 255, 0.25);
    background: rgba(0, 255, 255, 0.06);
    color: var(--text-light);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s ease;
}
.tag-btn.active {
    background: var(--primary-color);
    color: #000;
    border-color: var(--primary-color);
}
.tag-btn:hover {
    border-color: var(--primary-color);
}

/* --- Download Status Bar --- */
.download-status-bar {
    margin-top: 20px;
    padding: 16px 20px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: all 0.4s ease;
}
.download-status-bar.active {
    opacity: 1;
    max-height: 200px;
}
.status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: var(--text-dim);
}
.status-label {
    display: flex;
    align-items: center;
    gap: 6px;
}
.status-icon {
    color: var(--primary-color);
    font-weight: 700;
}
.status-value {
    color: var(--success-color);
    font-family: var(--font-mono);
    font-weight: 600;
}
.progress-track {
    margin-top: 8px;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 3px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary-color), var(--success-color));
    border-radius: 3px;
    transition: width 0.3s ease;
    width: 0;
}
</style>
</head>

<body>

    <main>
        <div class="container">
            <div class="download-card">
                <h1>Image Downloader</h1>
                <p>Download & zip anime images from multiple sources.</p>

                <!-- SFW / NSFW Toggle -->
                <div class="mode-toggle">
                    <button id="modeSfw" class="active">SFW</button>
                    <button id="modeNsfw">NSFW</button>
                </div>

                <div class="nsfw-warning" id="nsfwWarning">
                    NSFW content will be included in downloads.
                </div>

                <div class="input-group">
                    <label for="imageCount">Image Count:</label>
                    <input type="number" id="imageCount" value="50" min="1" max="200">
                </div>

                <div class="input-group">
                    <label for="apiSelector">Source:</label>
                    <select id="apiSelector">
                        <optgroup label="Anime API">
                            <option value="waifu.im">Waifu.im</option>
                            <option value="nekosapi">NekosAPI</option>
                            <option value="nekosia">Nekosia</option>
                        </optgroup>
                        <optgroup label="Booru">
                            <option value="konachan">Konachan</option>
                            <option value="yande.re">Yande.re</option>
                        </optgroup>
                        <optgroup label="Random">
                            <option value="pic.re">Pic.re</option>
                        </optgroup>
                    </select>
                </div>
                <div class="source-info" id="sourceInfo">Tags supported. Click to select/deselect.</div>

                <div class="input-group" id="tagGroup">
                    <label>Tags (optional):</label>
                    <div class="tag-selector" id="tagSelector">
                        <button class="tag-btn active" data-tag="waifu">Waifu</button>
                        <button class="tag-btn" data-tag="maid">Maid</button>
                        <button class="tag-btn" data-tag="marin-kitagawa">Marin</button>
                        <button class="tag-btn" data-tag="raiden-shogun">Raiden</button>
                        <button class="tag-btn" data-tag="oppai">Oppai</button>
                        <button class="tag-btn" data-tag="uniform">Uniform</button>
                        <button class="tag-btn" data-tag="school">School</button>
                        <button class="tag-btn" data-tag="landscape">Landscape</button>
                    </div>
                </div>

                <div style="margin-top: 25px;">
                    <button id="downloadBtn">DOWNLOAD & ZIP</button>
                </div>

                <div class="download-status-bar" id="downloadStatusBar">
                    <div class="status-text" id="statusText">Preparing...</div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                    </div>
                    <div class="progress-percentage" id="progressPercentage">0%</div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/components.js?v=6811d9d" defer></script>
    <script src="../js/main.js?v=6811d9d" defer></script>
    <script src="../js/img-downloader.js?v=6811d9d" defer></script>

</body>

</html>
