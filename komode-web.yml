services:
  mongo:
    # VẤN ĐỀ 3 FIX: pin version để tránh mongo:latest tự drift,
    # major upgrade làm vỡ wiredTiger / auth.
    # Db hiện tại đang chạy MongoDB 8.x (mongod --version) nên pin mongo:8
    # (KHÔNG được downgrade xuống 7 - wiredTiger không tương thích ngược).
    # Muốn chặt hơn nữa có thể pin exact minor: mongo:8.0
    image: mongo:8
    labels:
      komodo.skip: "true"
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password_change_me
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  core:
    image: ghcr.io/moghtech/komodo-core:2
    init: true
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # VẤN ĐỀ 4 FIX: thử https (self-signed, cần -k) trước,
      # fallback http khi core chạy ssl_enabled=false (mặc định).
      # Chỉ fail khi port không phản hồi (exit != 0 cả 2 nhánh).
      test: ["CMD-SHELL", "curl -sk https://localhost:9120/ || curl -s http://localhost:9120/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: admin
      KOMODO_DATABASE_PASSWORD: admin_password_change_me
      TZ: Asia/Ho_Chi_Minh
      # VẤN ĐỀ 5 FIX: TODO - đổi thành URL truy cập thật (vd https://komodo.example.com).
      # Quên đổi sẽ làm webhook URL và OAuth redirect sai.
      KOMODO_HOST: https://your-domain.com
      KOMODO_TITLE: Komodo
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: admin
      KOMODO_INIT_ADMIN_PASSWORD: changeme
      KOMODO_DISABLE_CONFIRM_DIALOG: "false"
      KOMODO_DISABLE_INIT_RESOURCES: "false"
      KOMODO_WEBHOOK_SECRET: a_random_secret
      KOMODO_JWT_SECRET: a_random_jwt_secret
      KOMODO_JWT_TTL: 1-day
      KOMODO_MONITORING_INTERVAL: 15-sec
      KOMODO_RESOURCE_POLL_INTERVAL: 1-hr
      KOMODO_DISABLE_USER_REGISTRATION: "false"
      KOMODO_ENABLE_NEW_USERS: "false"
      KOMODO_DISABLE_NON_ADMIN_CREATE: "false"
      KOMODO_TRANSPARENT_MODE: "false"
      KOMODO_LOGGING_PRETTY: "false"
      KOMODO_PRETTY_STARTUP_CONFIG: "false"
    volumes:
      - komodo-backups:/backups
      # VẤN ĐỀ 1 FIX (root cause handshake): mount key storage giống
      # compose chính thức của komodo (mongo.compose.yaml: keys:/config/keys).
      # Thiếu volume này, core.key nằm ở writable layer -> mỗi lần
      # recreate container là sinh key MỚI -> toàn bộ agent vỡ handshake.
      - keys:/config/keys
      # VẤN ĐỀ 5 FIX: persist sync files (ResourceSyncs)
      - komodo-syncs:/syncs
      # VẤN ĐỀ 5 FIX: persist repo cache, tránh re-clone lại mỗi recreate
      - komodo-repo-cache:/repo-cache

volumes:
  mongo-data:
  mongo-config:
  komodo-backups:
  # VẤN ĐỀ 1 FIX: volume keys (tên trùng chuẩn komodo official,
  # share được với periphery.compose.yaml nếu chạy cùng host)
  keys:
  # VẤN ĐỀ 5 FIX
  komodo-syncs:
  komodo-repo-cache:
